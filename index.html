<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>火柴人變形跑酷 (Stickman Shape Runner)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    header {
      width: 100%;
      max-width: 520px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      background: #0284c7;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover {
      background: #334155;
      color: #fff;
    }
    .btn:active {
      transform: scale(0.96);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 520px;
      padding: 10px;
      overflow: hidden;
    }
    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 500 / 520;
      max-height: calc(100vh - 120px);
      background: #060a12;
      border: 1px solid #1e293b;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    footer {
      width: 100%;
      max-width: 520px;
      padding: 8px 16px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <span>🏃 STICKMAN RUNNER</span>
      <span class="badge">STEP 1</span>
    </div>
    <button class="btn" id="btnReset">重設姿勢 (Reset)</button>
  </header>

  <main>
    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="500" height="520"></canvas>
    </div>
  </main>

  <footer>
    拖拽節點：紫色(全身移動) / 紅色(手腕與腳踝) / 橙色(手肘與膝蓋) / 黃色(頭部)
  </footer>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const V_WIDTH = 500;
    const V_HEIGHT = 520;
    const GROUND_Y = 420;

    const BONE = {
      headR: 20,
      torso: 85,
      shoulderW: 24,
      hipW: 18,
      uArm: 46,
      fArm: 44,
      thigh: 62,
      calf: 62,
    };

    function pt(x, y) { return { x, y }; }
    function dist(p1, p2) { return Math.hypot(p2.x - p1.x, p2.y - p1.y); }

    function createDefaultPose(cx = 250) {
      const ankleY = GROUND_Y;
      const kneeY = ankleY - BONE.calf;
      const hipY = kneeY - BONE.thigh;
      const chestY = hipY - BONE.torso;
      const headY = chestY - BONE.headR - 8;

      const hip = pt(cx, hipY);
      const chest = pt(cx, chestY);
      const head = pt(cx, headY);
      const leftShoulder = pt(chest.x - BONE.shoulderW, chest.y + 4);
      const rightShoulder = pt(chest.x + BONE.shoulderW, chest.y + 4);
      const leftHipJoint = pt(hip.x - BONE.hipW, hip.y);
      const rightHipJoint = pt(hip.x + BONE.hipW, hip.y);

      return {
        head,
        chest,
        hip,
        leftShoulder,
        rightShoulder,
        leftElbow: pt(leftShoulder.x - 22, leftShoulder.y + BONE.uArm),
        leftWrist: pt(leftShoulder.x - 30, leftShoulder.y + BONE.uArm + BONE.fArm),
        rightElbow: pt(rightShoulder.x + 22, rightShoulder.y + BONE.uArm),
        rightWrist: pt(rightShoulder.x + 30, rightShoulder.y + BONE.uArm + BONE.fArm),
        leftHipJoint,
        rightHipJoint,
        leftKnee: pt(leftHipJoint.x - 6, kneeY),
        leftAnkle: pt(leftHipJoint.x - 10, ankleY),
        rightKnee: pt(rightHipJoint.x + 6, kneeY),
        rightAnkle: pt(rightHipJoint.x + 10, ankleY),
      };
    }

    let stickman = createDefaultPose(250);
    const activeDrags = new Map();

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (V_WIDTH / rect.width),
        y: (e.clientY - rect.top) * (V_HEIGHT / rect.height)
      };
    }

    function findHitNode(pos) {
      const nodes = [
        { key: 'leftWrist', pt: stickman.leftWrist, r: 28 },
        { key: 'rightWrist', pt: stickman.rightWrist, r: 28 },
        { key: 'leftAnkle', pt: stickman.leftAnkle, r: 28 },
        { key: 'rightAnkle', pt: stickman.rightAnkle, r: 28 },
        { key: 'leftElbow', pt: stickman.leftElbow, r: 22 },
        { key: 'rightElbow', pt: stickman.rightElbow, r: 22 },
        { key: 'leftKnee', pt: stickman.leftKnee, r: 22 },
        { key: 'rightKnee', pt: stickman.rightKnee, r: 22 },
        { key: 'head', pt: stickman.head, r: 24 },
        { key: 'hip', pt: stickman.hip, r: 24 },
      ];
      for (const node of nodes) {
        if (dist(pos, node.pt) <= node.r) return node.key;
      }
      return null;
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      const pos = getCanvasCoords(e);
      const hitKey = findHitNode(pos);
      if (hitKey) {
        activeDrags.set(e.pointerId, {
          key: hitKey,
          startX: pos.x,
          startY: pos.y,
          lastX: pos.x,
          lastY: pos.y,
          snapshot: JSON.parse(JSON.stringify(stickman))
        });
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      const drag = activeDrags.get(e.pointerId);
      if (!drag) return;
      e.preventDefault();
      const pos = getCanvasCoords(e);
      const key = drag.key;
      const dxTotal = pos.x - drag.startX;
      const dyTotal = pos.y - drag.startY;
      const dxStep = pos.x - drag.lastX;
      const dyStep = pos.y - drag.lastY;

      if (key === 'hip') {
        const snap = drag.snapshot;
        const allKeys = Object.keys(stickman);
        for (const k of allKeys) {
          stickman[k] = pt(snap[k].x + dxTotal, snap[k].y + dyTotal);
        }
      } else if (key === 'head') {
        stickman.head = pt(pos.x, pos.y);
        const angle = Math.atan2(pos.y - stickman.hip.y, pos.x - stickman.hip.x);
        stickman.chest = pt(
          stickman.hip.x + Math.cos(angle) * BONE.torso,
          stickman.hip.y + Math.sin(angle) * BONE.torso
        );
        stickman.leftShoulder = pt(stickman.chest.x - BONE.shoulderW, stickman.chest.y + 4);
        stickman.rightShoulder = pt(stickman.chest.x + BONE.shoulderW, stickman.chest.y + 4);
      } else if (key === 'leftWrist') {
        stickman.leftWrist = pt(pos.x, pos.y);
        stickman.leftElbow = pt(stickman.leftElbow.x + dxStep * 0.4, stickman.leftElbow.y + dyStep * 0.4);
      } else if (key === 'rightWrist') {
        stickman.rightWrist = pt(pos.x, pos.y);
        stickman.rightElbow = pt(stickman.rightElbow.x + dxStep * 0.4, stickman.rightElbow.y + dyStep * 0.4);
      } else if (key === 'leftAnkle') {
        stickman.leftAnkle = pt(pos.x, Math.min(GROUND_Y, pos.y));
        stickman.leftKnee = pt(stickman.leftKnee.x + dxStep * 0.4, stickman.leftKnee.y + dyStep * 0.4);
      } else if (key === 'rightAnkle') {
        stickman.rightAnkle = pt(pos.x, Math.min(GROUND_Y, pos.y));
        stickman.rightKnee = pt(stickman.rightKnee.x + dxStep * 0.4, stickman.rightKnee.y + dyStep * 0.4);
      } else if (key === 'leftElbow') {
        stickman.leftElbow = pt(pos.x, pos.y);
      } else if (key === 'rightElbow') {
        stickman.rightElbow = pt(pos.x, pos.y);
      } else if (key === 'leftKnee') {
        stickman.leftKnee = pt(pos.x, pos.y);
      } else if (key === 'rightKnee') {
        stickman.rightKnee = pt(pos.x, pos.y);
      }

      drag.lastX = pos.x;
      drag.lastY = pos.y;
    });

    window.addEventListener('pointerup', (e) => {
      if (activeDrags.has(e.pointerId)) {
        activeDrags.delete(e.pointerId);
      }
    });

    document.getElementById('btnReset').onclick = () => {
      stickman = createDefaultPose(250);
    };

    function render() {
      ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

      // 背景網格
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.3)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= V_WIDTH; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, V_HEIGHT); ctx.stroke();
      }
      for (let y = 0; y <= V_HEIGHT; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(V_WIDTH, y); ctx.stroke();
      }

      // 地面發光線
      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(V_WIDTH, GROUND_Y);
      ctx.stroke();

      // 地面陰影
      const grad = ctx.createLinearGradient(0, GROUND_Y, 0, V_HEIGHT);
      grad.addColorStop(0, 'rgba(6, 182, 212, 0.15)');
      grad.addColorStop(1, 'rgba(3, 7, 18, 0.8)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, GROUND_Y, V_WIDTH, V_HEIGHT - GROUND_Y);

      // 繪製骨架線條
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const seg = (p1, p2) => {
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      };

      // 軀幹
      seg(stickman.hip, stickman.chest);
      seg(stickman.chest, stickman.leftShoulder);
      seg(stickman.chest, stickman.rightShoulder);
      seg(stickman.hip, stickman.leftHipJoint);
      seg(stickman.hip, stickman.rightHipJoint);

      // 頭部
      ctx.beginPath();
      ctx.arc(stickman.head.x, stickman.head.y, BONE.headR, 0, Math.PI * 2);
      ctx.stroke();

      // 手臂
      seg(stickman.leftShoulder, stickman.leftElbow);
      seg(stickman.leftElbow, stickman.leftWrist);
      seg(stickman.rightShoulder, stickman.rightElbow);
      seg(stickman.rightElbow, stickman.rightWrist);

      // 腿部
      seg(stickman.leftHipJoint, stickman.leftKnee);
      seg(stickman.leftKnee, stickman.leftAnkle);
      seg(stickman.rightHipJoint, stickman.rightKnee);
      seg(stickman.rightKnee, stickman.rightAnkle);

      // 繪製彩色拖拽關節點
      const drawNode = (p, color, r = 7) => {
        ctx.save();
        ctx.fillStyle = color;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      };

      drawNode(stickman.hip, '#8b5cf6', 8);          // 紫色：骨盆（移動全身）
      drawNode(stickman.leftWrist, '#ef4444', 8);    // 紅色：手
      drawNode(stickman.rightWrist, '#ef4444', 8);
      drawNode(stickman.leftAnkle, '#ef4444', 8);    // 紅色：腳
      drawNode(stickman.rightAnkle, '#ef4444', 8);
      drawNode(stickman.leftElbow, '#f97316', 6);    // 橙色：肘
      drawNode(stickman.rightElbow, '#f97316', 6);
      drawNode(stickman.leftKnee, '#f97316', 6);     // 橙色：膝
      drawNode(stickman.rightKnee, '#f97316', 6);
      drawNode(stickman.head, '#fbbf24', 6);         // 黃色：頭部

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
