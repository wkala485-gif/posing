      align-items: center;

      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #020617;
      font-size: 14px;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .header-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-icon {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .btn-icon:hover {

      color: #fff;
    }
    .btn-lang {

    }
    .timer-badge {

      border: 1px solid #f59e0b;

      font-size: 12px;
      font-weight: 700;

      padding: 6px 12px;

      letter-spacing: 0.05em;
    }
    .mission-name {

          { title: '10: Duo Human Clock Stacking', code: '10. DUO 45s', sub: 'A forms firm base · B handstands as clock hands', quote: '"Ultimate camouflage! Base agent grounded, upper agent legs spread at 10:10!"' }

    // Auto-detect browser language as default
    let currentLang = (typeof navigator !== 'undefined' && navigator.language && navigator.language.toLowerCase().startsWith('zh')) ? 'zh' : 'en';

    // --- Audio Synthesizer (Web Audio API) ---
    class SoundEngine {
      constructor() { this.ctx = null; this.muted = false; }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playTone(freq, type, dur, gainVal = 0.15) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(gainVal, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + dur + 0.01);
        } catch(e){}
      }
      playPop() { this.playTone(320, 'sine', 0.08, 0.2); }
      playRelease() { this.playTone(220, 'triangle', 0.12, 0.15); }
      playTick() { this.playTone(700, 'sine', 0.04, 0.1); }
      playSuccess() {
        if (this.muted) return;
        this.init();
        [440, 554, 659, 880].forEach((f, i) => setTimeout(() => this.playTone(f, 'triangle', 0.2, 0.2), i * 110));
      }
      playFail() {
        if (this.muted) return;
        this.init();
        [240, 200, 160, 110].forEach((f, i) => setTimeout(() => this.playTone(f, 'sawtooth', 0.2, 0.15), i * 130));
      }
    }
    const sound = new SoundEngine();

    // --- Bone Config & Physics Constants ---
    const CANVAS_WIDTH = 500;
    const CANVAS_HEIGHT = 520;
    const GROUND_Y = 436;
    const BONE = { torso: 82, shoulder: 26, uArm: 48, fArm: 46, hipW: 20, thigh: 60, calf: 60, headR: 22 };

    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
    function dist(p1, p2) { return Math.hypot(p2.x - p1.x, p2.y - p1.y); }
    function pt(x, y) { return { x, y }; }

    function vecAngle(p1, p2) {
      return Math.atan2(p2.y - p1.y, p2.x - p1.x);
    }

    function angleDiffDeg(a1, a2) {
      let diff = Math.abs(a1 - a2);
      while (diff > Math.PI) diff = Math.abs(2 * Math.PI - diff);
      return (diff * 180) / Math.PI;
    }

    function createGroundedPose(cx, groundY = GROUND_Y) {
      const ankleY = groundY;
      const kneeY = ankleY - BONE.calf;
      const hipY = kneeY - BONE.thigh;
      const chestY = hipY - BONE.torso;
      const headY = chestY - BONE.headR - 6;

      const hip = pt(cx, hipY);
      const chest = pt(cx, chestY);
      const head = pt(cx, headY);
      const leftShoulder = pt(chest.x - BONE.shoulder, chest.y + 4);
      const rightShoulder = pt(chest.x + BONE.shoulder, chest.y + 4);
      const leftHipJoint = pt(hip.x - BONE.hipW, hip.y);
      const rightHipJoint = pt(hip.x + BONE.hipW, hip.y);

      return {
        hip, chest, head,
        leftShoulder,
        leftElbow: pt(leftShoulder.x - 20, leftShoulder.y + BONE.uArm),
        leftWrist: pt(leftShoulder.x - 28, leftShoulder.y + BONE.uArm + BONE.fArm),
        rightShoulder,
        rightElbow: pt(rightShoulder.x + 20, rightShoulder.y + BONE.uArm),
        rightWrist: pt(rightShoulder.x + 28, rightShoulder.y + BONE.uArm + BONE.fArm),
        leftHipJoint,
        leftKnee: pt(leftHipJoint.x - 6, kneeY),
        leftAnkle: pt(leftHipJoint.x - 10, ankleY),
        rightHipJoint,
        rightKnee: pt(rightHipJoint.x + 6, kneeY),
        rightAnkle: pt(rightHipJoint.x + 10, ankleY),
      };
    }

    // --- Strict Vector & Bone Angle Evaluation (No Torso Free Points, Each Limb 25%) ---
    function checkLimbAngles(p, t) {
      const lUpper = angleDiffDeg(vecAngle(p.leftShoulder, p.leftElbow), vecAngle(t.leftShoulder, t.leftElbow));
      const lLower = angleDiffDeg(vecAngle(p.leftElbow, p.leftWrist), vecAngle(t.leftElbow, t.leftWrist));
      const rUpper = angleDiffDeg(vecAngle(p.rightShoulder, p.rightElbow), vecAngle(t.rightShoulder, t.rightElbow));
      const rLower = angleDiffDeg(vecAngle(p.rightElbow, p.rightWrist), vecAngle(t.rightElbow, t.rightWrist));

      const lThigh = angleDiffDeg(vecAngle(p.leftHipJoint, p.leftKnee), vecAngle(t.leftHipJoint, t.leftKnee));
      const lCalf = angleDiffDeg(vecAngle(p.leftKnee, p.leftAnkle), vecAngle(t.leftKnee, t.leftAnkle));
      const rThigh = angleDiffDeg(vecAngle(p.rightHipJoint, p.rightKnee), vecAngle(t.rightHipJoint, t.rightKnee));
      const rCalf = angleDiffDeg(vecAngle(p.rightKnee, p.rightAnkle), vecAngle(t.rightKnee, t.rightAnkle));

      return {
        leftArm: (lUpper <= 18 && lLower <= 18),
        rightArm: (rUpper <= 18 && rLower <= 18),
        leftLeg: (lThigh <= 18 && lCalf <= 18),
        rightLeg: (rThigh <= 18 && rCalf <= 18),
        angles: { lUpper, lLower, rUpper, rLower, lThigh, lCalf, rThigh, rCalf }
      };
    }

    function boneScoreFromDeg(deg) {
      if (deg <= 18) return Math.round(100 - deg * 1.35); // 18 deg -> 75.7%, 0 deg -> 100%
      if (deg >= 48) return 0;
      return Math.round(Math.max(0, 75.7 - (deg - 18) * (75.7 / 30)));
    }

    function scoreAgent(p, t) {
      const { angles } = checkLimbAngles(p, t);

      // Score for each limb: both upper and lower segments
      const sLArm = (boneScoreFromDeg(angles.lUpper) + boneScoreFromDeg(angles.lLower)) / 2;
      const sRArm = (boneScoreFromDeg(angles.rUpper) + boneScoreFromDeg(angles.rLower)) / 2;
      const sLLeg = (boneScoreFromDeg(angles.lThigh) + boneScoreFromDeg(angles.lCalf)) / 2;
      const sRLeg = (boneScoreFromDeg(angles.rThigh) + boneScoreFromDeg(angles.rCalf)) / 2;

      // 4 Limbs each count 25%. Torso has 0% free points!
      const total = Math.round(sLArm * 0.25 + sRArm * 0.25 + sLLeg * 0.25 + sRLeg * 0.25);
      return clamp(total, 0, 100);
    }

    function computeMatchScore() {
      const sA = scoreAgent(playerA, targetA);
      if (!isDuo || !playerB || !targetB) return sA;
      const sB = scoreAgent(playerB, targetB);
      const minS = Math.min(sA, sB);
      return Math.round(minS * 0.4 + ((sA + sB) / 2) * 0.6);
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function getCanvasCoord(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (CANVAS_WIDTH / rect.width),
        y: (e.clientY - rect.top) * (CANVAS_HEIGHT / rect.height)
      };
    }

    function findHit(pos) {
      const test = (pose, agent) => {
        const tests = [
          { name: 'leftWrist', pt: pose.leftWrist, r: 32 },
          { name: 'rightWrist', pt: pose.rightWrist, r: 32 },
          { name: 'leftAnkle', pt: pose.leftAnkle, r: 32 },
          { name: 'rightAnkle', pt: pose.rightAnkle, r: 32 },
          { name: 'leftElbow', pt: pose.leftElbow, r: 24 },
          { name: 'rightElbow', pt: pose.rightElbow, r: 24 },
          { name: 'leftKnee', pt: pose.leftKnee, r: 24 },
          { name: 'rightKnee', pt: pose.rightKnee, r: 24 },
          { name: 'head', pt: pose.head, r: 28 },
          { name: 'hip', pt: pose.hip, r: 26 },
        ];
        for (const t of tests) {
          if (dist(pos, t.pt) <= t.r) return { agent, joint: t.name };
        }
        return null;
      };

      if (isDuo && playerB) {
        const hitB = test(playerB, 'B');
        if (hitB) return hitB;
      }
      return test(playerA, 'A');
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      const pos = getCanvasCoord(e);
      const hit = findHit(pos);
      if (hit) {
        const targetPose = hit.agent === 'A' ? playerA : playerB;
        activeDrags.set(e.pointerId, {
          agent: hit.agent,
          joint: hit.joint,
          startX: pos.x,
          startY: pos.y,
          lastX: pos.x,
          lastY: pos.y,
          initPose: JSON.parse(JSON.stringify(targetPose))
        });
        sound.playPop();
      }
    });

    // Pure freeform dragging: NO solve2BoneIK, no snapping, no flipping
    canvas.addEventListener('pointermove', (e) => {
      const drag = activeDrags.get(e.pointerId);
      if (!drag) return;
      e.preventDefault();
      const pos = getCanvasCoord(e);
      const pose = drag.agent === 'A' ? playerA : playerB;
      const init = drag.initPose;
      const joint = drag.joint;
      const dxTotal = pos.x - drag.startX;
      const dyTotal = pos.y - drag.startY;
      const dxStep = pos.x - drag.lastX;
      const dyStep = pos.y - drag.lastY;

      if (joint === 'hip') {
        Object.keys(pose).forEach(k => { pose[k] = pt(init[k].x + dxTotal, init[k].y + dyTotal); });
      } else if (joint === 'head') {
        pose.head = pt(pos.x, pos.y);
        const angle = Math.atan2(pos.y - pose.hip.y, pos.x - pose.hip.x);
        pose.chest = pt(pose.hip.x + Math.cos(angle) * BONE.torso, pose.hip.y + Math.sin(angle) * BONE.torso);
      } else if (joint === 'leftWrist') {
        pose.leftWrist = pt(pos.x, pos.y);
        pose.leftElbow = pt(pose.leftElbow.x + dxStep * 0.45, pose.leftElbow.y + dyStep * 0.45);
      } else if (joint === 'rightWrist') {
        pose.rightWrist = pt(pos.x, pos.y);
        pose.rightElbow = pt(pose.rightElbow.x + dxStep * 0.45, pose.rightElbow.y + dyStep * 0.45);
      } else if (joint === 'leftAnkle') {
        pose.leftAnkle = pt(pos.x, Math.min(GROUND_Y, pos.y));
        pose.leftKnee = pt(pose.leftKnee.x + dxStep * 0.45, pose.leftKnee.y + dyStep * 0.45);
      } else if (joint === 'rightAnkle') {
        pose.rightAnkle = pt(pos.x, Math.min(GROUND_Y, pos.y));
        pose.rightKnee = pt(pose.rightKnee.x + dxStep * 0.45, pose.rightKnee.y + dyStep * 0.45);
      } else if (joint === 'leftElbow') {
        pose.leftElbow = pt(pos.x, pos.y);
      } else if (joint === 'rightElbow') {
        pose.rightElbow = pt(pos.x, pos.y);
      } else if (joint === 'leftKnee') {
        pose.leftKnee = pt(pos.x, pos.y);
      } else if (joint === 'rightKnee') {
        pose.rightKnee = pt(pos.x, pos.y);
      }

      drag.lastX = pos.x;
      drag.lastY = pos.y;
      updateUI();
    });

    window.addEventListener('pointerup', (e) => {
      if (activeDrags.has(e.pointerId)) {
        sound.playRelease();
        activeDrags.delete(e.pointerId);
      }
    });

    function updateUI() {
      const score = computeMatchScore();
      const scoreNum = document.getElementById('scoreNum');
      const progressFill = document.getElementById('progressFill');
      const commentTag = document.getElementById('commentTag');
      const btnSubmit = document.getElementById('btnSubmit');
      const langData = I18N[currentLang];

      scoreNum.innerText = score + '%';
      progressFill.style.width = score + '%';

      if (score >= 65) {
        scoreNum.style.color = '#10b981';

        commentTag.style.borderColor = '#10b981';
        commentTag.style.color = '#6ee7b7';
        commentTag.style.background = 'rgba(16, 185, 129, 0.15)';
        commentTag.innerText = langData.critiqueReady;
        btnSubmit.classList.add('ready');
      } else if (score >= 40) {
        scoreNum.style.color = '#f59e0b';
        progressFill.style.background = '#f59e0b';
        commentTag.style.borderColor = '#f59e0b';
        commentTag.style.color = '#fcd34d';
        commentTag.style.background = 'rgba(245, 158, 11, 0.15)';
        commentTag.innerText = langData.critiqueClose;
        btnSubmit.classList.remove('ready');
      } else {
        scoreNum.style.color = '#f43f5e';
        progressFill.style.background = '#f43f5e';
        commentTag.style.borderColor = '#f43f5e';
        commentTag.style.color = '#fda4af';
        commentTag.style.background = 'rgba(244, 63, 94, 0.15)';
        commentTag.innerText = langData.critiqueFar;
        btnSubmit.classList.remove('ready');
      }
    }

    function render() {
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      ctx.fillStyle = '#060a12';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.35)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= CANVAS_WIDTH; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CANVAS_HEIGHT); ctx.stroke();
      }
      for (let y = 0; y <= CANVAS_HEIGHT; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CANVAS_WIDTH, y); ctx.stroke();
      }

      // Ground plane
      const grad = ctx.createLinearGradient(0, GROUND_Y, 0, CANVAS_HEIGHT);
      grad.addColorStop(0, 'rgba(56, 189, 248, 0.12)');
      grad.addColorStop(1, 'rgba(15, 23, 42, 0.6)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);

      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y); ctx.lineTo(CANVAS_WIDTH, GROUND_Y);
      ctx.stroke();

      for (let x = 15; x < CANVAS_WIDTH; x += 25) {
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, GROUND_Y); ctx.lineTo(x - 10, GROUND_Y + 10); ctx.stroke();
      }

      ctx.font = '10px monospace';
      ctx.fillStyle = 'rgba(56, 189, 248, 0.6)';
      ctx.fillText('GROUND LEVEL // 0.00 M', 14, GROUND_Y + 20);

      // Render Shadow Target Bones
      const drawTargetBones = (pose, color, lineWidth, dash = false) => {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (dash) ctx.setLineDash([7, 5]);

        const drawSegment = (p1, p2) => {
          ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        };

        drawSegment(pose.hip, pose.chest);
        drawSegment(pose.chest, pose.leftShoulder); drawSegment(pose.chest, pose.rightShoulder);
        drawSegment(pose.hip, pose.leftHipJoint); drawSegment(pose.hip, pose.rightHipJoint);
        drawSegment(pose.leftShoulder, pose.leftElbow); drawSegment(pose.leftElbow, pose.leftWrist);
        drawSegment(pose.rightShoulder, pose.rightElbow); drawSegment(pose.rightElbow, pose.rightWrist);
        drawSegment(pose.leftHipJoint, pose.leftKnee); drawSegment(pose.leftKnee, pose.leftAnkle);
        drawSegment(pose.rightHipJoint, pose.rightKnee); drawSegment(pose.rightKnee, pose.rightAnkle);

        ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(pose.head.x, pose.head.y, BONE.headR, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      };

      if (showGhost) {
        drawTargetBones(targetA, isDuo ? 'rgba(56, 189, 248, 0.35)' : 'rgba(148, 163, 184, 0.35)', 7, true);
        if (isDuo && targetB) {
          drawTargetBones(targetB, 'rgba(251, 146, 60, 0.35)', 7, true);
        }
      }

      if (showGuide) {
        ctx.save();
        ctx.strokeStyle = 'rgba(234, 179, 8, 0.3)';
        ctx.setLineDash([3, 3]);
        const drawPairs = (p, t) => {
          [
            [p.leftWrist, t.leftWrist], [p.rightWrist, t.rightWrist],
            [p.leftAnkle, t.leftAnkle], [p.rightAnkle, t.rightAnkle]
          ].forEach(([p1, p2]) => {
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
          });
        };
        drawPairs(playerA, targetA);
        if (isDuo && playerB && targetB) drawPairs(playerB, targetB);
        ctx.restore();
      }

      // Draw Player Bones with Emerald Green (#10B981) feedback when dual bones align <= 18°
      const drawPlayerBonesWithGlow = (pose, target, defaultColor) => {
        const matches = checkLimbAngles(pose, target);
        const GLOW_COLOR = '#10B981';

        const drawSegment = (p1, p2, col, isGlow) => {
          ctx.save();
          ctx.strokeStyle = col;
          ctx.lineWidth = 6;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          if (isGlow) {
            ctx.shadowColor = '#10B981';
            ctx.shadowBlur = 10;
          }
          ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
          ctx.restore();
        };

        // Torso / Head in default agent color
        drawSegment(pose.hip, pose.chest, defaultColor, false);
        drawSegment(pose.chest, pose.leftShoulder, defaultColor, false);
        drawSegment(pose.chest, pose.rightShoulder, defaultColor, false);
        drawSegment(pose.hip, pose.leftHipJoint, defaultColor, false);
        drawSegment(pose.hip, pose.rightHipJoint, defaultColor, false);

        // Head
        ctx.save();
        ctx.strokeStyle = defaultColor;
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(pose.head.x, pose.head.y, BONE.headR, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();

        // Limbs: Glow #10B981 strictly if dual bones <= 18 deg!
        const lArmCol = matches.leftArm ? GLOW_COLOR : defaultColor;
        drawSegment(pose.leftShoulder, pose.leftElbow, lArmCol, matches.leftArm);
        drawSegment(pose.leftElbow, pose.leftWrist, lArmCol, matches.leftArm);

        const rArmCol = matches.rightArm ? GLOW_COLOR : defaultColor;
        drawSegment(pose.rightShoulder, pose.rightElbow, rArmCol, matches.rightArm);
        drawSegment(pose.rightElbow, pose.rightWrist, rArmCol, matches.rightArm);

        const lLegCol = matches.leftLeg ? GLOW_COLOR : defaultColor;
        drawSegment(pose.leftHipJoint, pose.leftKnee, lLegCol, matches.leftLeg);
        drawSegment(pose.leftKnee, pose.leftAnkle, lLegCol, matches.leftLeg);

        const rLegCol = matches.rightLeg ? GLOW_COLOR : defaultColor;
        drawSegment(pose.rightHipJoint, pose.rightKnee, rLegCol, matches.rightLeg);
        drawSegment(pose.rightKnee, pose.rightAnkle, rLegCol, matches.rightLeg);
      };

      drawPlayerBonesWithGlow(playerA, targetA, isDuo ? '#38bdf8' : '#ffffff');
      if (isDuo && playerB && targetB) {
        drawPlayerBonesWithGlow(playerB, targetB, '#fb923c');
      }

      // Joint Touch Handles
      const drawHandles = (pose, colMain, colSub) => {
        const drawH = (pt, col, r) => {
          ctx.save();
          ctx.fillStyle = col; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(pt.x, pt.y, r * 0.35, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        };
        drawH(pose.leftWrist, colMain, 9);
        drawH(pose.rightWrist, colMain, 9);
        drawH(pose.leftAnkle, colMain, 9);
        drawH(pose.rightAnkle, colMain, 9);
        drawH(pose.leftElbow, colSub, 6);
        drawH(pose.rightElbow, colSub, 6);
        drawH(pose.leftKnee, colSub, 6);
        drawH(pose.rightKnee, colSub, 6);
        drawH(pose.head, '#fbbf24', 6);
        drawH(pose.hip, '#a855f7', 6);
      };

      drawHandles(playerA, isDuo ? '#06b6d4' : '#ef4444', isDuo ? '#38bdf8' : '#f97316');
      if (isDuo && playerB) {
        drawHandles(playerB, '#ea580c', '#fb923c');
      }

      requestAnimationFrame(render);
    }
    render();

    function updateLanguageUI() {
      const data = I18N[currentLang];
      document.getElementById('brandTitle').innerText = data.brandTitle;
      document.getElementById('btnSound').innerText = sound.muted ? data.btnSoundOff : data.btnSoundOn;
      document.getElementById('btnReset').innerText = data.btnReset;
      document.getElementById('btnLevel').innerText = data.btnLevel;
      document.getElementById('btnToggleShadow').innerText = showGhost ? data.btnShadowShow : data.btnShadowHide;
      document.getElementById('btnGuide').innerText = showGuide ? data.btnGuideOn : data.btnGuideOff;
      document.getElementById('btnSubmit').innerText = data.btnSubmit;
      document.getElementById('scoreLabel').innerText = data.scoreLabel;
      document.getElementById('modalTopSecret').innerText = data.evalTitle;
      document.getElementById('modalTimeLabel').innerText = data.timeLabel;
      document.getElementById('btnModalRetry').innerText = data.btnRetry;
      document.getElementById('btnModalNext').innerText = data.btnNext;

      const missionInfo = data.missions[currentLvlIdx];
      if (missionInfo) {
        document.getElementById('missionCode').innerText = missionInfo.code;
        document.getElementById('missionName').innerText = missionInfo.title;
        document.getElementById('missionDesc').innerText = missionInfo.sub;
      }
      updateUI();
    }

    function loadMission(idx) {
      currentLvlIdx = idx;
      const lvl = LEVELS[idx];
      isDuo = lvl.isDuo;

      targetA = JSON.parse(JSON.stringify(lvl.targetA));
      targetB = lvl.targetB ? JSON.parse(JSON.stringify(lvl.targetB)) : null;

      if (isDuo) {
        playerA = createGroundedPose(190);
        playerB = createGroundedPose(310);
      } else {
        playerA = createGroundedPose(250);
        playerB = null;
      }

      clearInterval(timerId);
      countdown = TOTAL_LEVEL_TIME;
      const timerBadge = document.getElementById('timerBadge');
      timerBadge.style.display = 'inline-flex';
      timerBadge.classList.remove('timer-urgent');
      timerBadge.innerText = `⏱ ${countdown}s`;

      timerId = setInterval(() => {
        countdown--;
        timerBadge.innerText = `⏱ ${countdown}s`;
        if (countdown <= 5) {
          timerBadge.classList.add('timer-urgent');
          sound.playTick();
        }
        if (countdown <= 0) {
          clearInterval(timerId);
          // Directly trigger submitPose() on timeout without fake fail!
          submitPose();
        }
      }, 1000);

      updateLanguageUI();
    }

    loadMission(0);

    function submitPose() {
      clearInterval(timerId);
      const score = computeMatchScore();
      const modal = document.getElementById('resultModal');
      const isPass = score >= 65; // Consistent 65% passing threshold
      const data = I18N[currentLang];

      // Dynamic actual time spent calculation: TOTAL_LEVEL_TIME - remaining countdown
      const timeSpent = Math.max(0.1, TOTAL_LEVEL_TIME - Math.max(0, countdown)).toFixed(1);
      document.getElementById('modalTimeSpent').innerText = timeSpent + 's';

      document.getElementById('modalScore').innerText = score + '%';
      document.getElementById('modalScore').style.color = isPass ? '#10b981' : '#f43f5e';
      document.getElementById('modalVerdict').innerText = isPass ? data.verdictPass : (isDuo ? data.verdictFailDuo : data.verdictFailSolo);
      document.getElementById('modalStars').innerText = score >= 90 ? '★★★' : isPass ? '★★☆' : '☆☆☆';
      document.getElementById('modalQuote').innerText = data.missions[currentLvlIdx].quote;
      modal.style.display = 'flex';

      if (isPass) sound.playSuccess(); else sound.playFail();
    }

    document.getElementById('btnSubmit').onclick = submitPose;

    document.getElementById('btnReset').onclick = () => {
      if (isDuo) {
        playerA = createGroundedPose(190);
        playerB = createGroundedPose(310);
      } else {
        playerA = createGroundedPose(250);
      }
      updateUI();
    };

    document.getElementById('btnSound').onclick = () => {
      sound.muted = !sound.muted;
      const data = I18N[currentLang];
      document.getElementById('btnSound').innerText = sound.muted ? data.btnSoundOff : data.btnSoundOn;
    };

    document.getElementById('btnToggleShadow').onclick = () => {
      showGhost = !showGhost;
      const data = I18N[currentLang];
      document.getElementById('btnToggleShadow').innerText = showGhost ? data.btnShadowShow : data.btnShadowHide;
    };

    document.getElementById('btnGuide').onclick = () => {
      showGuide = !showGuide;
      const data = I18N[currentLang];
      document.getElementById('btnGuide').innerText = showGuide ? data.btnGuideOn : data.btnGuideOff;
    };

    document.getElementById('btnLevel').onclick = () => {
      currentLvlIdx = (currentLvlIdx + 1) % LEVELS.length;
      loadMission(currentLvlIdx);
    };

    // Toggle Language between zh and en
    document.getElementById('btnLang').onclick = () => {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      updateLanguageUI();
    };

    document.getElementById('btnModalRetry').onclick = () => {
      document.getElementById('resultModal').style.display = 'none';
      loadMission(currentLvlIdx);
    };

    document.getElementById('btnModalNext').onclick = () => {
      document.getElementById('resultModal').style.display = 'none';
      currentLvlIdx = (currentLvlIdx + 1) % LEVELS.length;
      loadMission(currentLvlIdx);
    };
  </script>
</body>
</html>
